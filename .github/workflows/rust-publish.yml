name: Publish Github Tag

on:
  push:
    tags: [ "v*" ]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always


jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - name: tests
        run: cargo test --verbose

  github-publish:
    needs: [test]
    environment: gh-publish

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - uses: Swatinem/rust-cache@v2
    - name: package
      run: cargo package
    - name: gh
      run: gh release create "${{github.ref_name}}" target/package/*.crate --generate-notes
    env:
      GH_TOKEN: ${{github.token}}
